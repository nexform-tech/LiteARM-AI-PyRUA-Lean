name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e ./pyrua-lean

      - name: Check syntax
        run: python -m compileall -q src pyrua-lean/src tools/litearm

      - name: Test
        run: pytest tests pyrua-lean/tests/test_litearm.py pyrua-lean/tests/test_robots.py
